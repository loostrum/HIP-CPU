name: CI

on:
    push:
        branches:
            - master
    pull_request:
        branches:
            - master

jobs:
    test-Ubuntu:
        name: Ubuntu-${{ matrix.compiler.name }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                compiler:
                    - { name: GCC, cxx: g++ }
                    - { name: Clang, cxx: clang++ }
        steps:
            - name: Fetch TBB
              run: sudo apt-get install libtbb-dev

            - name: Checkout
              uses: actions/checkout@v3.6.0

            - name: Build 
              run: |
                cd ${{github.workspace}}
                mkdir build
                cd build
                cmake ../ -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_COMPILER=${{ matrix.compiler.cxx }}
                cmake --build ${{github.workspace}}/build --config RelWithDebInfo -j 3

            - name: Run tests
              run: |
                cd ${{github.workspace}}/build
                ctest -C RelWithDebInfo --output-on-failure
